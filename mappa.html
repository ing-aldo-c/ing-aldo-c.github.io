<body>
<div id="header">
  <a class="brand" href="index.html" id="brandHome">
    <div class="brand-logo">CC</div>
    <div class="brand-text">
      <span class="brand-name">Ing. Cataldo Carletta</span>
      <span class="brand-sub" data-i18n="subtitle">CV Geospaziale Interattivo</span>
    </div>
  </a>
  <div class="hbtns">
    <div class="lang-switch" role="group" aria-label="Lingua / Language">
      <button class="lang-btn" data-lang="it" onclick="setLang('it')">IT</button>
      <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
    </div>
    <a href="mailto:ing.aldocarletta@gmail.com" class="email"><i class="fas fa-envelope"></i> <span data-i18n="email">Email</span></a>
    <a href="https://www.linkedin.com/in/aldo-carletta" target="_blank" rel="noopener" class="linkedin"><i class="fab fa-linkedin"></i> <span>LinkedIn</span></a>
    <a href="index.html" class="home" id="btnHome"><i class="fas fa-house"></i> <span data-i18n="home">Home</span></a>
    <button class="guida" onclick="apriGuida()" data-i18n-title="guideTitle" title="Come usare la mappa"><i class="fas fa-circle-info"></i> <span data-i18n="guide">Guida</span></button>
  </div>
</div>

<div id="tabs">
  <div class="tab active" data-tab="lavoro" title="Esperienze" onclick="mostraSezione('lavoro')"><i class="fas fa-briefcase"></i> <span data-i18n="tabWork">Esperienze</span> <span class="cnt" id="nEsp"></span></div>
  <div class="tab" data-tab="formazione" title="Formazione" onclick="mostraSezione('formazione')"><i class="fas fa-graduation-cap"></i> <span data-i18n="tabEdu">Formazione</span> <span class="cnt" id="nForm"></span></div>
  <div class="tab" data-tab="convegni" title="Convegni" onclick="mostraSezione('convegni')"><i class="fas fa-microphone"></i> <span data-i18n="tabTalks">Convegni</span> <span class="cnt" id="nConv"></span></div>
  <div class="tab" data-tab="timeline" title="Timeline" onclick="mostraSezione('timeline')"><i class="fas fa-clock-rotate-left"></i> <span data-i18n="tabTime">Timeline</span></div>
</div>

<div id="container">
  <div id="sidebar">
    <div id="sec-lavoro" class="section active"></div>
    <div id="sec-formazione" class="section"></div>
    <div id="sec-convegni" class="section"></div>
    <div id="sec-timeline" class="section"></div>
  </div>
  <div id="mapbox">
    <div id="filterPanel">
      <div class="fp-title"><i class="fas fa-layer-group"></i> <span data-i18n="filter">Filtra layer</span></div>
      <label class="fp-row">
        <input type="checkbox" checked onchange="toggleCategory('lavoro', this.checked)">
        <span class="fp-dot" style="background:#0d9488;"></span>
        <span data-i18n="tabWork">Esperienze</span>
      </label>
      <label class="fp-row formazione">
        <input type="checkbox" checked onchange="toggleCategory('formazione', this.checked)">
        <span class="fp-dot" style="background:#6366f1;"></span>
        <span data-i18n="tabEdu">Formazione</span>
      </label>
      <label class="fp-row convegni">
        <input type="checkbox" checked onchange="toggleCategory('convegni', this.checked)">
        <span class="fp-dot" style="background:#f59e0b;"></span>
        <span data-i18n="tabTalks">Convegni</span>
      </label>
    </div>
    <div id="map"></div>
    <div id="layerBtn" onclick="toggleLayer()">
      <span class="icon"><i class="fas fa-map"></i></span>
      <span id="layerLabel">Passa a Mappa</span>
    </div>
  </div>
</div>

<!-- ===== MODAL GUIDA ===== -->
<div id="guida-overlay">
  <div id="guida-box">
    <h2><i class="fas fa-map-location-dot"></i> <span data-i18n-html="gTitle">Come usare la <span>mappa</span></span></h2>
    <p class="guida-sub" data-i18n-html="gSub"></p>
    <ul>
      <li><span class="g-icon"><i class="fas fa-location-dot"></i></span><span data-i18n-html="g1"></span></li>
      <li><span class="g-icon"><i class="fas fa-hand-pointer"></i></span><span data-i18n-html="g2"></span></li>
      <li><span class="g-icon"><i class="fas fa-table-columns"></i></span><span data-i18n-html="g3"></span></li>
      <li><span class="g-icon"><i class="fas fa-satellite"></i></span><span data-i18n-html="g4"></span></li>
      <li><span class="g-icon"><i class="fas fa-filter"></i></span><span data-i18n-html="g5"></span></li>
      <li><span class="g-icon"><i class="fas fa-clock-rotate-left"></i></span><span data-i18n-html="g6"></span></li>
    </ul>
    <div class="guida-footer">
      <label class="guida-check"><input type="checkbox" id="chk-non-mostrare"> <span data-i18n-html="gHide">Non mostrare pi&ugrave;</span></label>
      <button id="btn-chiudi-guida" onclick="chiudiGuida()" data-i18n-html="gStart">Inizia a esplorare &#8594;</button>
    </div>
  </div>
</div>
